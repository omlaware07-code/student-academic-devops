apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-academic-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-academic
  template:
    metadata:
      labels:
        app: student-academic
    spec:
      containers:
        - name: student-academic
          image: student-academic-platform:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
